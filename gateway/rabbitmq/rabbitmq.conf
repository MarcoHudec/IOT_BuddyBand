# RabbitMQ configuration for the BuddyBand gateway (new-style rabbitmq.conf).
# Replaces the Erlang-term rabbitmq.config from the course template.
# MQTT topic levels "/" become routing-key dots "." on the amq.topic exchange,
# so AMQP consumers bind to "buddyband.#" (protocol.md §7).

# ---- MQTT (teacher band, Node-RED, test tools) ----
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous      = false
mqtt.vhost                = /
mqtt.exchange             = amq.topic

# ---- MQTT over WebSocket (teacher app, local copy on the Pi – architecture.md §5.4) ----
web_mqtt.tcp.port = 15675

# ---- management UI ----
management.tcp.port = 15672
