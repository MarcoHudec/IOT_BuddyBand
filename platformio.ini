; BuddyBand firmware – one code base, role and ID chosen per build environment.
; Boards: ESP32 DevKit with ESP32-WROOM-32D (classic ESP32, BLE 4.2 + Wi-Fi).
; Build/flash in VS Code: PlatformIO sidebar → pick environment → Upload.
; CLI: pio run -e band1 -t upload && pio device monitor -e band1

[platformio]
default_envs = band1

[env]
platform = espressif32
board = esp32dev            ; ESP32-WROOM-32D DevKit ("ESP32 Dev Module" in the course)
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    knolleary/PubSubClient@^2.8
build_flags =
    -D GROUP_ID=1

; ---------- application ----------
[app]
build_src_filter = +<app/>

[env:band1]
extends = app
build_flags = ${env.build_flags} -D NODE_ID=1

[env:band2]
extends = app
build_flags = ${env.build_flags} -D NODE_ID=2

[env:band3]
extends = app
build_flags = ${env.build_flags} -D NODE_ID=3

[env:teacher]
extends = app
build_flags = ${env.build_flags} -D NODE_ID=0 -D ROLE_TEACHER

; ---------- RSSI measurement (milestone M1) ----------
; Flash rssi_a on one board and rssi_b on another, open the serial monitor
; of one of them and copy the CSV lines into evaluation/rssi/.
[rssi]
build_src_filter = +<rssi_test/>

[env:rssi_a]
extends = rssi
build_flags = ${env.build_flags} -D NODE_ID=11

[env:rssi_b]
extends = rssi
build_flags = ${env.build_flags} -D NODE_ID=12
